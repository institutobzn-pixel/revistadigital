<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card de Citação — Instituto BZN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132C42; --clay:#B26A4C; --paper:#F5EFE4; --paper-2:#EDE5D6; --muted:#736C5E; --line:rgba(19,44,66,.16);
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;}
  body{
    font-family:var(--sans); background:var(--paper); color:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .frame{
    width:1080px;height:1080px; padding:96px;
    display:flex; flex-direction:column; justify-content:center;
    position:relative;
  }
  .mark{
    font-family:var(--serif); font-size:140px; color:var(--clay);
    line-height:1; margin-bottom:12px;
  }
  .quote{
    font-family:var(--serif); font-weight:500; font-size:52px; line-height:1.22;
    text-wrap:balance;
  }
  .attr{
    margin-top:36px; font-family:var(--sans); font-weight:600; font-size:22px; color:var(--muted);
  }
  .rule{ width:64px; height:3px; background:var(--clay); margin-top:32px; }
  .brand{
    position:absolute; bottom:64px; left:96px;
    font-family:var(--serif); font-weight:700; font-size:22px; color:var(--navy);
  }
  .brand span{ color:var(--clay); }
</style>
</head>
<body>
  <div class="frame">
    <div class="mark">&ldquo;</div>
    <div class="quote">{{CITACAO}}</div>
    <div class="attr">{{AUTOR}}</div>
    <div class="rule"></div>
    <div class="brand">Instituto <span>BZN</span></div>
  </div>
</body>
</html>
