<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story — Instituto BZN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132C42; --navy-soft:#274257; --navy-deep:#0C1E2E;
    --clay:#B26A4C; --clay-deep:#9A5638;
    --paper:#F5EFE4; --paper-2:#EDE5D6; --muted:#736C5E;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  body{font-family:var(--sans); background:var(--navy-deep); color:var(--paper);}
  .frame{
    width:1080px;height:1920px;position:relative;
    background:
      linear-gradient(180deg, rgba(12,30,46,.15) 0%, rgba(12,30,46,.92) 78%),
      url('{{IMAGEM}}') center/cover no-repeat;
  }
  .safe{
    position:absolute; left:64px; right:64px; top:220px; bottom:260px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .kicker{
    font-family:var(--sans); font-weight:700; font-size:18px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--paper);
    background:var(--clay); display:inline-block; padding:10px 20px; border-radius:999px;
    margin-bottom:24px; width:fit-content;
  }
  .headline{
    font-family:var(--serif); font-weight:600; font-size:76px; line-height:1.06;
  }
  .sub{ margin-top:20px; font-size:28px; color:var(--paper-2); max-width:900px; }
  .cta{
    position:absolute; left:64px; right:64px; bottom:120px;
    display:flex; align-items:center; gap:14px;
  }
  .cta .pill{
    font-family:var(--sans); font-weight:600; font-size:22px;
    border:2px solid var(--paper); border-radius:999px; padding:16px 28px;
  }
  .brand{
    position:absolute; top:96px; left:64px;
    font-family:var(--serif); font-weight:700; font-size:26px; color:var(--paper);
  }
  .brand span{ color:var(--clay); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">Instituto <span>BZN</span></div>
    <div class="safe">
      <div class="kicker">{{KICKER}}</div>
      <div class="headline">{{TITULO}}</div>
      <div class="sub">{{SUBTITULO}}</div>
    </div>
    <div class="cta"><div class="pill">{{CTA}}</div></div>
  </div>
</body>
</html>
