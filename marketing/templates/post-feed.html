<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post Feed — Instituto BZN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132C42; --navy-soft:#274257; --navy-deep:#0C1E2E;
    --clay:#B26A4C; --clay-deep:#9A5638;
    --paper:#F5EFE4; --paper-2:#EDE5D6; --muted:#736C5E; --line:rgba(19,44,66,.16);
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--navy);
    position:relative;
  }
  .frame{
    width:1080px;height:1350px;
    display:flex;flex-direction:column;
    padding:64px;
  }
  .photo{
    position:relative;
    flex:1;
    border-radius:4px;
    overflow:hidden;
    background:var(--navy-soft) center/cover no-repeat;
    /* substitua a url abaixo pela foto real (caminho local ou base64) */
    background-image:
      linear-gradient(180deg, rgba(19,44,66,.05) 0%, rgba(12,30,46,.75) 100%),
      url('{{IMAGEM}}');
  }
  .kicker{
    position:absolute; top:36px; left:36px;
    font-family:var(--sans); font-weight:700; font-size:15px;
    letter-spacing:.14em; text-transform:uppercase;
    color:var(--paper);
    background:var(--clay);
    padding:8px 16px; border-radius:999px;
  }
  .caption-block{
    position:absolute; left:36px; right:36px; bottom:32px;
    color:var(--paper);
  }
  .headline{
    font-family:var(--serif); font-weight:600;
    font-size:56px; line-height:1.08;
    text-wrap:balance;
  }
  .sub{
    margin-top:14px; font-size:22px; color:var(--paper-2); max-width:820px;
  }
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:28px;
  }
  .brand{
    font-family:var(--serif); font-weight:700; font-size:22px; color:var(--navy);
  }
  .brand span{color:var(--clay);}
  .tag{
    font-family:var(--sans); font-size:16px; color:var(--muted);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="photo">
      <div class="kicker">{{KICKER}}</div>
      <div class="caption-block">
        <div class="headline">{{TITULO}}</div>
        <div class="sub">{{SUBTITULO}}</div>
      </div>
    </div>
    <div class="footer">
      <div class="brand">Instituto <span>BZN</span></div>
      <div class="tag">{{DATA}}</div>
    </div>
  </div>
</body>
</html>
